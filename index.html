<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOOST Community Group — moved</title>
<meta name="robots" content="noindex">
<script>
  // Path-preserving redirect. GitHub Pages serves this file for any path it
  // cannot match, so /BOOST/erd-navigator/ lands here and is forwarded intact.
  (function () {
    var NEW_HOST = "https://biogenics-traceability.github.io";
    var target = NEW_HOST + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
  a { color: #0b5; }
</style>
</head>
<body>
  <h1>This page has moved</h1>
  <p>The BOOST Community Group's GitHub organization was renamed, so
     <code>boost-working-group.github.io</code> is no longer the right address.</p>
  <p>You should be redirected automatically. If not, continue to
     <a id="target" href="https://biogenics-traceability.github.io/BOOST/">the current documentation</a>.</p>
  <script>
    document.getElementById("target").href =
      "https://biogenics-traceability.github.io" + window.location.pathname + window.location.search + window.location.hash;
  </script>
</body>
</html>
